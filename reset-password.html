<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Sıfırla — Disiplan</title>
  <style>
    :root {
      --accent: #12A3E3;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --border: #e0e4ef;
      --text: #1f2937;
      --text2: #4b5563;
      --text3: #6b7280;
      --text4: #9ca3af;
      --danger: #dc2626;
      --success: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: var(--text3); margin-bottom: 24px; }
    label {
      display: block; font-size: 13px; font-weight: 500;
      margin-bottom: 6px; margin-top: 12px; color: var(--text2);
    }
    input {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 15px; color: var(--text); background: var(--surface);
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%; margin-top: 20px; padding: 14px;
      background: var(--accent); color: #fff; border: none;
      border-radius: 12px; font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.7; cursor: wait; }
    .msg {
      margin-top: 12px; padding: 12px; border-radius: 10px;
      font-size: 13px; display: none;
    }
    .msg.error   { background: #fef2f2; color: var(--danger); display: block; }
    .msg.success { background: #f0fdf4; color: var(--success); display: block; }
    .back {
      display: block; margin-top: 20px; text-align: center;
      color: var(--accent); font-size: 14px; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Şifre Sıfırla</h1>
    <p class="subtitle">Yeni şifreni belirle. Disiplan'a girişte bunu kullanacaksın.</p>

    <div id="msg" class="msg"></div>

    <div id="formBox">
      <label for="newPwd">Yeni Şifre</label>
      <input type="password" id="newPwd" placeholder="En az 6 karakter" autocomplete="new-password">

      <label for="newPwd2">Şifreyi Tekrar Gir</label>
      <input type="password" id="newPwd2" placeholder="••••••••" autocomplete="new-password">

      <button id="submitBtn" onclick="submit()">Şifreyi Güncelle</button>
    </div>

    <a href="index.html" class="back">← Giriş ekranına dön</a>
  </div>

  <script>
    const SB   = 'https://uzkscrrqyxftbtwkiyra.supabase.co';
    const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6a3NjcnJxeXhmdGJ0d2tpeXJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDkxNDMsImV4cCI6MjA5MjI4NTE0M30.wA7g4SVacghNunC0nt6ZP3SgHZ6U6LAWu3ggUrypBxE';

    function setMsg(text, kind) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + (kind || '');
    }

    /**
     * Supabase recover linki #access_token=...&refresh_token=... formatında
     * hash'le gelir. Bunları yakalayıp session set ederiz, sonra updateUser
     * ile yeni şifre.
     */
    let accessToken = null;
    let refreshToken = null;

    function parseHashTokens() {
      const hash = location.hash.replace(/^#/, '');
      const params = new URLSearchParams(hash);
      const at = params.get('access_token');
      const rt = params.get('refresh_token');
      const type = params.get('type');
      if (type === 'recovery' && at && rt) {
        accessToken = at;
        refreshToken = rt;
        // Hash'i temizle (token URL'de kalmasın)
        history.replaceState(null, '', location.pathname);
        return true;
      }
      return false;
    }

    async function submit() {
      const p1 = document.getElementById('newPwd').value;
      const p2 = document.getElementById('newPwd2').value;
      if (p1.length < 6) { setMsg('Şifre en az 6 karakter olmalı.', 'error'); return; }
      if (p1 !== p2) { setMsg('Şifreler eşleşmiyor.', 'error'); return; }
      if (!accessToken) { setMsg('Sıfırlama bağlantısı geçersiz veya süresi dolmuş.', 'error'); return; }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      try {
        const res = await fetch(`${SB}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'apikey': ANON,
            'Authorization': 'Bearer ' + accessToken,
          },
          body: JSON.stringify({ password: p1 }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error_description || err.msg || `HTTP ${res.status}`);
        }
        setMsg('Şifren güncellendi. Yeni şifrenle giriş yapabilirsin.', 'success');
        document.getElementById('formBox').style.display = 'none';
      } catch (e) {
        setMsg('Hata: ' + (e?.message || e), 'error');
      } finally {
        btn.disabled = false;
      }
    }

    // Boot
    if (!parseHashTokens()) {
      setMsg(
        'Sıfırlama bağlantısı geçersiz. Lütfen e-postandaki linke yeniden tıkla veya yeni bir bağlantı talep et.',
        'error'
      );
      document.getElementById('formBox').style.display = 'none';
    }
  </script>
</body>
</html>
